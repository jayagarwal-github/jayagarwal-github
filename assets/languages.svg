<svg
  width="350"
  height="165"
  viewBox="0 0 350 165"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">TypeScript 30%, Dart 25%, Kotlin 20%, JavaScript 12%, Prisma 8%, Python 5%</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #70a5fd;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    @supports(-moz-appearance: auto) {
      .header { font-size: 15.5px; }
    }
    @keyframes slideInAnimation {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes growWidthAnimation {
      from { width: 0; }
      to { width: 100%; }
    }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, -apple-system, BlinkMacSystemFont, Sans-Serif;
      fill: #38bdae;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    #rect-mask rect {
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    .lang-progress {
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <rect
    data-testid="card-bg"
    x="0.5"
    y="0.5"
    rx="4.5"
    height="99%"
    stroke="#e4e2e2"
    stroke-opacity="0"
    width="349"
    fill="#1a1b27"
  />

  <g data-testid="card-title" transform="translate(25, 35)">
    <text x="0" y="0" class="header" data-testid="header">Most Used Languages</text>
  </g>

  <g data-testid="main-card-body" transform="translate(0, 55)">
    <svg data-testid="lang-items" x="25">
      <mask id="rect-mask">
        <rect x="0" y="0" width="300" height="8" fill="white" rx="4"/>
      </mask>
      
      <!-- Progress segments for 300px total width -->
      <rect mask="url(#rect-mask)" class="lang-progress" x="0" y="0" width="90" height="8" fill="#3178C6" />
      <rect mask="url(#rect-mask)" class="lang-progress" x="90" y="0" width="75" height="8" fill="#00B4AB" />
      <rect mask="url(#rect-mask)" class="lang-progress" x="165" y="0" width="60" height="8" fill="#A97BFF" />
      <rect mask="url(#rect-mask)" class="lang-progress" x="225" y="0" width="36" height="8" fill="#F1E05A" />
      <rect mask="url(#rect-mask)" class="lang-progress" x="261" y="0" width="24" height="8" fill="#5A67D8" />
      <rect mask="url(#rect-mask)" class="lang-progress" x="285" y="0" width="15" height="8" fill="#3572A5" />

      <g transform="translate(0, 25)">
        <!-- Column 1 -->
        <g transform="translate(0, 0)">
          <g class="stagger" style="animation-delay: 300ms">
            <circle cx="5" cy="6" r="5" fill="#3178C6" />
            <text x="15" y="10" class="lang-name">TypeScript 30%</text>
          </g>
          <g class="stagger" style="animation-delay: 450ms">
            <circle cx="5" cy="31" r="5" fill="#00B4AB" />
            <text x="15" y="35" class="lang-name">Dart 25%</text>
          </g>
          <g class="stagger" style="animation-delay: 600ms">
            <circle cx="5" cy="56" r="5" fill="#A97BFF" />
            <text x="15" y="60" class="lang-name">Kotlin 20%</text>
          </g>
        </g>
        
        <!-- Column 2 -->
        <g transform="translate(155, 0)">
          <g class="stagger" style="animation-delay: 300ms">
            <circle cx="5" cy="6" r="5" fill="#F1E05A" />
            <text x="15" y="10" class="lang-name">JavaScript 12%</text>
          </g>
          <g class="stagger" style="animation-delay: 450ms">
            <circle cx="5" cy="31" r="5" fill="#5A67D8" />
            <text x="15" y="35" class="lang-name">Prisma 8%</text>
          </g>
          <g class="stagger" style="animation-delay: 600ms">
            <circle cx="5" cy="56" r="5" fill="#3572A5" />
            <text x="15" y="60" class="lang-name">Python 5%</text>
          </g>
        </g>
      </g>
    </svg>
  </g>
</svg>
